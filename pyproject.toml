[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applegpu-lab"
version = "0.1.0"
description = "Time Triton kernels on Apple GPUs and publish comparable results to a GitHub board"
requires-python = ">=3.10"

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]
